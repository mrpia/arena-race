<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
    <title>Arena Race</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      /* The 3D scene, with the HUD's see-through canvas on top of it. */
      canvas { display: block; position: fixed; left: 0; top: 0; }
      .emoji-button {
        width: 36px; height: 36px; padding: 0; cursor: pointer;
        font: 20px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif; line-height: 1;
        background: rgba(255, 255, 255, 0.8); border: none; border-radius: 8px;
      }
      .emoji-button:hover { background: #fff; }
      .emoji-button.chosen { outline: 3px solid #ffd43b; outline-offset: 1px; }
      /* The GitHub icon, and in its place during a race the pause button. */
      #github, #pause {
        position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
        display: flex; align-items: center; justify-content: center;
      }
      #github[hidden], #pause[hidden] { display: none; }
      #pause-menu {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
        display: flex; flex-direction: column; align-items: center; gap: 20px;
        padding: 24px 32px; border-radius: 16px; background: rgba(20, 24, 34, 0.92);
        max-width: calc(100vw - 32px); box-sizing: border-box;
      }
      #pause-menu[hidden] { display: none; }
      #pause-menu h2 { margin: 0; color: #fff; font: bold 40px system-ui, sans-serif; }
      #pause-menu .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
      #github svg { width: 24px; height: 24px; fill: #1b1f2a; }
      #start-area {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
        width: max-content; max-width: calc(100vw - 32px);
      }
      #start-area[hidden] { display: none; }
      #keyboard-hint {
        flex-basis: 100%; margin: 0; padding: 10px 16px; border-radius: 12px;
        text-align: center; color: #fff; background: rgba(20, 24, 34, 0.92);
        font: bold 22px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
      }
      #keyboard-hint[hidden] { display: none; }
      /* Under the start button: a row each for the number of players, the view, the track and the floor. Out of
         the flow, so the start button stays where it was and doesn't run into the winner's line
         above it. max-content: positioned from the middle of a narrow button, the rows would
         otherwise only get half its width. */
      #start-choices {
        position: absolute; top: calc(100% + 18px); left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 10px; width: max-content;
      }
      /* A row too long for the window (the floors, on a phone) wraps onto a second line. */
      .choice-row {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
        padding: 6px 10px; border-radius: 12px; max-width: calc(100vw - 32px); box-sizing: border-box;
        background: rgba(20, 24, 34, 0.92); user-select: none;
      }
      /* Room for two animals side by side on the two-player choice. */
      #player-choices .emoji-button { width: auto; min-width: 36px; padding: 0 8px; }
      #view-choices .emoji-button { font-size: 15px; font-weight: bold; }
      /* Each track is a small map, drawn on a canvas (paintTrackPicture in hud.ts). */
      #track-choices .emoji-button { width: auto; height: auto; padding: 3px; line-height: 0; }
      #track-choices canvas { position: static; display: block; }
      #view-choices .key {
        min-width: 14px; padding: 2px 5px; border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 5px;
        color: #fff; font: bold 14px system-ui, sans-serif; text-align: center;
      }
      .start {
        padding: 18px 36px; cursor: pointer; user-select: none;
        font: bold 36px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        color: #1b1f2a; background: #ffd43b; border: none; border-radius: 16px;
        box-shadow: 0 6px 0 #c99a00, 0 10px 24px rgba(0, 0, 0, 0.5);
      }
      .start:hover { background: #ffe066; }
      .start:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #c99a00, 0 6px 16px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <canvas id="hud"></canvas>
    <!-- The GitHub mark: mark-github-16.svg from @primer/octicons 19.15.1 (MIT). -->
    <a id="github" class="emoji-button" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    </a>
    <button id="pause" class="emoji-button" type="button" hidden></button>
    <div id="pause-menu" hidden>
      <h2 id="pause-text"></h2>
      <div class="choices">
        <button id="resume" class="start" type="button"></button>
        <button id="quit" class="start" type="button"></button>
      </div>
    </div>
    <div id="start-area">
      <p id="keyboard-hint" hidden></p>
      <button id="start" class="start" type="button"></button>
      <div id="start-choices">
        <div id="player-choices" class="choice-row"></div>
        <div id="view-choices" class="choice-row"></div>
        <div id="track-choices" class="choice-row"></div>
        <div id="floor-choices" class="choice-row"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
