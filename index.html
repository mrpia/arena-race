<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
    <title>Arena Starter</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      canvas { display: block; image-rendering: auto; }
      #side-controls {
        position: fixed; left: 12px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 16px;
        user-select: none;
      }
      .emoji-button {
        width: 36px; height: 36px; padding: 0; cursor: pointer;
        font: 20px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif; line-height: 1;
        background: rgba(255, 255, 255, 0.8); border: none; border-radius: 8px;
      }
      .emoji-button:hover { background: #fff; }
      .emoji-button.chosen { outline: 3px solid #ffd43b; outline-offset: 1px; }
      #camera { font-size: 15px; font-weight: bold; }
      #floor-control { position: relative; }
      #floor-picker {
        position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
        display: flex; gap: 6px; padding: 6px; border-radius: 10px;
        background: rgba(20, 24, 34, 0.92); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      #floor-picker[hidden] { display: none; }
      #start {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        padding: 18px 44px; cursor: pointer; user-select: none;
        font: bold 36px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
        color: #1b1f2a; background: #ffd43b; border: none; border-radius: 16px;
        box-shadow: 0 6px 0 #c99a00, 0 10px 24px rgba(0, 0, 0, 0.5);
      }
      #start:hover { background: #ffe066; }
      #start:active {
        transform: translate(-50%, calc(-50% + 4px));
        box-shadow: 0 2px 0 #c99a00, 0 6px 16px rgba(0, 0, 0, 0.5);
      }
      #start[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="side-controls">
      <button id="camera" class="emoji-button" type="button"></button>
      <div id="floor-control">
        <button id="floor" class="emoji-button" type="button"></button>
        <div id="floor-picker" hidden></div>
      </div>
    </div>
    <button id="start" type="button"></button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
